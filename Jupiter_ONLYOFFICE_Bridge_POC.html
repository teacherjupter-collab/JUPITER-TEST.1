<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jupiter ONLYOFFICE Bridge</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #f6f7fb;
      font-family: Arial, sans-serif;
      color: #17233b;
    }
    #status {
      padding: 12px 16px;
      border-bottom: 1px solid #e3e7ef;
      background: #fff;
      font-size: 13px;
    }
    #ds-frame {
      width: 100%;
      height: calc(100vh - 45px);
      min-height: 720px;
    }
  </style>
  <script src="https://docspace-5vm1a1.onlyoffice.com/static/scripts/sdk/2.2.0/api.js"></script>
</head>
<body>
  <div id="status">Loading ONLYOFFICE…</div>
  <div id="ds-frame"></div>

  <script>
    (function () {
      const status = document.getElementById('status');

      function setStatus(message) {
        status.textContent = message;
      }

      function fail(message) {
        setStatus(message);
        console.error(message);
      }

      if (!window.DocSpace || !window.DocSpace.SDK) {
        fail('ONLYOFFICE SDK did not initialize on this host.');
        return;
      }

      try {
        const instance = window.DocSpace.SDK.initManager({
          frameId: 'ds-frame',
          src: 'https://docspace-5vm1a1.onlyoffice.com',
          width: '100%',
          height: '100%',
          showMenu: true,
          events: {
            onAppReady: function () {
              setStatus('ONLYOFFICE DocSpace is ready.');
            }
          }
        });

        window.jupiterOnlyOfficeInstance = instance;
        setStatus('Connecting to ONLYOFFICE…');
      } catch (error) {
        fail(
          'ONLYOFFICE initialization failed: ' +
          (error && error.message ? error.message : String(error))
        );
      }
    })();
  </script>
</body>
</html>
